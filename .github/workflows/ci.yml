name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/initial-structure", "feature/sonar_cloud" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Sonar analice todo el historial

      # 2. Preparar Java con caché para que vaya más rápido
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilar, Testear con Docker y Analizar en Sonar (Todo en 1)
      - name: Build, Test and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: true # Evita que Docker se cuelgue en GitHub Actions
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Adri29an08_mgcss-track-1