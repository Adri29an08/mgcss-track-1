name: Release Automation

# Trigger: Solo se dispara al hacer push de un tag que empiece por 'v'
on: 
  push: 
    tags: 
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que GitHub Actions pueda crear la release

    steps:
      # 1. Hacer checkout
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Preparar el entorno Java 
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Compilar proyecto y  generar artefacto
      - name: Compilar y generar artefacto
        run: mvn clean package

      # 4. Construir imagen Docker
      - name: Construir imagen Docker
        run: docker build -t mgcss-track:${{ github.ref_name }} .

      # 5. Publicar Release en GitHub 
      
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}