name: Release Automation

# Trigger: Solo se dispara al hacer push de un tag que empiece por 'v'
on: 
  push: 
    tags: 
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que GitHub Actions pueda crear la release

    steps:
      # 1. Hacer checkout
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Preparar el entorno Java 
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 2. Compilar, testear y verificar Quality Gate (FASE 5)
      - name: Compilar, testear y analizar calidad (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Adri29an08_mgcss-track-1

      # 3. Construir imagen Docker
      - name: Construir imagen Docker
        run: docker build -t mgcss-track:${{ github.ref_name }} .

      # 5. Publicar Release en GitHub
      - name: Publicar Release
        run: |
          gh release create ${{ github.ref_name }} \
            target/*.jar \
            --generate-notes \
            --title "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}