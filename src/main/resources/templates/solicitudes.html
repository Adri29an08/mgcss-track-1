<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>MGCSS - Gestión de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h1 class="mb-4">🖥️ Gestión de Solicitudes</h1>

    <!-- Formulario nueva solicitud -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header fw-bold">Nueva Solicitud</div>
        <div class="card-body">
            <form th:action="@{/solicitudes/nueva}" method="post">
                <div class="input-group">
                    <input type="text" name="descripcion" class="form-control"
                           placeholder="Descripción de la incidencia (mínimo 10 caracteres)..."
                           required minlength="10">
                    <button type="submit" class="btn btn-primary">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de solicitudes -->
    <div class="card shadow-sm">
        <div class="card-header fw-bold">Listado de Solicitudes</div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Fecha Creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(solicitudes)}">
                        <td colspan="5" class="text-center text-muted py-3">No hay solicitudes registradas.</td>
                    </tr>
                    <tr th:each="s : ${solicitudes}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.descripcion}"></td>
                        <td>
                            <span th:text="${s.estado}"
                                  th:classappend="${s.estado.name() == 'ABIERTA'} ? 'bg-primary' : (${s.estado.name() == 'EN_PROCESO'} ? 'bg-warning text-dark' : 'bg-success')"
                                  class="badge"></span>
                        </td>
                        <td th:text="${s.fechaCreacion != null ? #temporals.format(s.fechaCreacion, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td>
                            <form th:action="@{/solicitudes/{id}/cerrar(id=${s.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        th:disabled="${s.estado.name() != 'EN_PROCESO'}">Cerrar</button>
                            </form>
                            <form th:action="@{/solicitudes/{id}/reabrir(id=${s.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-warning"
                                        th:disabled="${s.estado.name() != 'CERRADA'}">Reabrir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a href="/swagger-ui.html" class="btn btn-outline-secondary btn-sm">📄 Ver API (Swagger)</a>
    </div>

</div>

</body>
</html>
